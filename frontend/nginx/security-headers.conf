# Cabeceras de seguridad. Se incluyen en cada location que define sus propias
# cabeceras, porque nginx no hereda add_header del bloque server en ese caso.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Solo recursos del propio origen. 'unsafe-inline' en estilos lo requieren los
# atributos style que generan los componentes de Mantine.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
