server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    # API: se reenvía al backend por la red frontend_net. El navegador ve un solo
    # origen, así que la cookie de sesión (SameSite=Strict) funciona sin CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos compilados: su nombre incluye un hash, así que se pueden cachear sin límite.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html no se cachea: así cada despliegue llega al navegador de inmediato.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # React Router maneja las rutas en el navegador: cualquier ruta que no sea un
    # archivo existente devuelve index.html (por ejemplo, al recargar /notas-credito/15).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
